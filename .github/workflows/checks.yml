name: Build and checks
on:
  push:
    branches: [main]
    paths-ignore: ['docs/site/**', '*.md', 'LICENSE']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/WinUninstaller/WebUI/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Install web dependencies
        working-directory: app/WinUninstaller/WebUI
        run: npm ci
      - name: React contracts
        working-directory: app/WinUninstaller/WebUI
        run: npm test
      - name: Build local web interface
        working-directory: app/WinUninstaller/WebUI
        run: npm run build
      - name: Component rendering contracts
        working-directory: app/WinUninstaller/WebUI
        run: node tests/render-audit.mjs
      - name: Build Windows application
        run: dotnet build app/WinUninstaller/WinUninstaller.csproj -c Release -p:SkipLocalWebUiBuild=true -p:NuGetAudit=false
      - name: Verify shipping assembly and SQLite
        run: dotnet run --project tests/ProductIntegrity.Tests/ProductIntegrity.Tests.csproj -c Release -p:SkipLocalWebUiBuild=true -p:NuGetAudit=false
      - name: Build interactive engine runner
        run: dotnet build tests/Engine.Tests/Engine.Tests.csproj -c Release -p:NuGetAudit=false
# Full process/desktop acceptance runs locally in the authorized Windows user
# context. Compiling that runner here is not a claim that those tests ran in CI.
