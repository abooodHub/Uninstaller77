name: Bug report
description: Report a reproducible issue in Uninstaller 77.
body:
  - type: markdown
    attributes:
      value: Do not post unredacted logs, profile paths, access tokens or personal information.
  - type: input
    id: version
    attributes:
      label: Application version and installation source
      placeholder: 1.0.0 from the GitHub release
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: Redacted failure code or screenshot
      description: Include the exact exit code only if an uninstaller actually ran.
